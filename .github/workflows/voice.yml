name: 產生發音音檔

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate＝產生 App 用的音檔；samples＝產生各聲音的試聽檔'
        type: choice
        options: [generate, samples]
        default: generate
      speaker:
        description: 'VOICEVOX 角色名稱（留空＝沿用目前的聲音，預設冥鳴ひまり）'
        required: false
        default: ''
      style:
        description: '風格（留空＝ノーマル）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'js/**'
      - 'tools/gen-audio.mjs'

permissions:
  contents: write

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安裝 ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 產生音檔
        env:
          SPEAKER: ${{ inputs.speaker }}
          STYLE: ${{ inputs.style }}
        run: |
          if [ "${{ inputs.mode }}" = "samples" ]; then
            node tools/gen-audio.mjs --samples
          else
            node tools/gen-audio.mjs
          fi

      - name: 提交音檔
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "音檔沒有變動"
          else
            git commit -m "更新發音音檔（VOICEVOX）"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
